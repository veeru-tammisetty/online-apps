<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <title>Nova Retail — Checkout</title>
      <link rel="stylesheet" href="assets/styles.css" />
       <script src="https://assets.adobedtm.com/d9fe0ea961b4/2ffc22ee7e2d/launch-0ade72df7713-development.min.js" async></script>
      <script src="assets/adobe-web-sdk.js" defer></script>
      <script src="assets/site.js" defer></script>
   </head>
   <body>
      <header class="site-header">
         <a class="logo" href="index.html">NOVA<span>RETAIL</span></a>
         <nav>
            <a href="index.html">Home</a><a href="shop.html">Shop</a
            ><a href="product.html?id=aurora-lamp">Product</a
            ><a href="cart.html">Cart <b id="cart-count">0</b></a
            ><a class="active" href="checkout.html">Checkout</a>
         </nav>
      </header>
      <main class="section checkout">
         <div>
            <p class="eyebrow">SECURE CHECKOUT</p>
            <h1>Complete your order</h1>
            <form id="checkout-form">
               <label>Email<input name="email" type="email" required /></label
               ><label>Full name<input name="name" required /></label
               ><label>Address<input name="address" required /></label>
               <div class="two">
                  <label>City<input name="city" required /></label
                  ><label>Postcode<input name="postcode" required /></label>
               </div>
               <button class="btn" type="submit">Place demo order</button>
            </form>
         </div>
         <aside class="order-box">
            <h2>Order summary</h2>
            <div id="checkout-summary"></div>
            <strong>Total: <span id="checkout-total">$0.00</span></strong>
         </aside>
      </main>
      <footer>© 2026 Nova Retail · Demo storefront</footer>
      <script src="assets/checkout.js" defer></script>
   </body>
</html>
