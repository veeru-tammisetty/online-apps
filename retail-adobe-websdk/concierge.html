<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brand Concierge — Standalone Test</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, Arial, sans-serif; background: #f5f5f5; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 18px; color: #333; }
    #brand-concierge-mount {
      width: 100%;
      height: 640px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
    }
    .hint { font-size: 12px; color: #666; margin-top: 8px; }
  </style>

  <!-- Brand Concierge Web Client -->
  <script src="https://experience.adobe.net/solutions/experience-platform-brand-concierge-web-agent/static-assets/main.js"></script>

  <!-- Single Web SDK (alloy) loader -->
  <script>
    !(function (n, o) {
      o.forEach(function (name) {
        n[name] ||
          ((n.__alloyNS = n.__alloyNS || []).push(name),
          (n[name] = function () {
            var u = arguments;
            return new Promise(function (i, l) { n[name].q.push([i, l, u]); });
          }),
          (n[name].q = []));
      });
    })(window, ["alloy"]);
  </script>
  <script src="https://cdn1.adoberesources.net/alloy/2.35.1/alloy.min.js"></script>

  <!-- Configure the Web SDK (includes conversation.region for Brand Concierge) -->
  <script>
    alloy("configure", {
      defaultConsent: "in",
      edgeDomain: "edge.adobedc.net",
      edgeBasePath: "ee",
      datastreamId: "7c1168d7-ea8b-46aa-a71f-ee1280e77e6b",
      orgId: "1F6324765762BE0E7F000101@AdobeOrg",
      debugEnabled: true,
      idMigrationEnabled: false,
      thirdPartyCookiesEnabled: false,
      prehidingStyle: ".personalization-container { opacity: 0 !important }",
      conversation: { region: "va7" }
    });

    // Fire an event and log whether the Edge serves the concierge
    alloy("sendEvent", {}).then(function (r) {
      console.log("[concierge-test] propositions:", r.propositions);
      if (!r.propositions || r.propositions.length === 0) {
        console.warn("[concierge-test] EMPTY propositions -> surface configuration is NOT serving this domain yet.");
      } else {
        console.log("[concierge-test] Concierge payload received -> UI should render.");
      }
    });
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Brand Concierge — Standalone Test Page</h1>
    <div id="brand-concierge-mount"></div>
    <p class="hint">Open the browser console (F12) to see the propositions result. If the box stays empty, the surface configuration for this domain is not yet active.</p>
  </div>

  <!-- Mount the concierge -->
  <script>
    window.styleConfigurations = {
      metadata: {
        brandName: "Deloitte Retail POC",
        version: "1.0.0",
        language: "en-US",
        namespace: "brand-concierge"
      }
    };

    window.adobe.concierge.bootstrap({
      instanceName: "alloy",
      stylingConfigurations: window.styleConfigurations,
      selector: "#brand-concierge-mount"
    });
  </script>
</body>
</html>
